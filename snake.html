<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nokia SVG - Snake II</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #121212;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    /* Phone Shell Wrapper */
    .phone-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.6));
    }
    
    /* HTML Screen inside SVG ForeignObject */
    .lcd-display {
      width: 100%;
      height: 100%;
      background-color: #6abf81;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      border: 1.5px solid #2d5237;
      font-family: monospace;
    }
    
    /* Scoreboard Header Bar */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #5ea872;
      padding: 2px 4px;
      font-size: 7px;
      font-weight: bold;
      color: #0d2613;
      border-bottom: 1.5px solid #2d5237;
      height: 12px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* Dedicated Playable Canvas Area below the HUD */
    canvas {
      width: 100%;
      flex-grow: 1;
      image-rendering: pixelated;
      background-color: #6abf81;
      display: block;
    }

    .screen-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #6abf81;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #0d2613;
      text-align: text-center;
      z-index: 5;
    }
    .screen-overlay h2 {
      margin: 0 0 2px 0;
          font-family: Arial, Helvetica, sans-serif;
          font-weight: 900;
          font-size: 10px;
      letter-spacing: 0.5px;
    }
    .screen-overlay p {
      margin: 1px 0;
      font-size: 6px;
      font-weight: bold;
    }
    .hidden {
      display: none !important;
    }

    /* Keypad Visible Labels Overlay */
    .keypad-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .key-target {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #2c354d;
      font-weight: bold;
      line-height: 1;
      transition: transform 0.05s ease, background-color 0.1s ease;
      border-radius: 40%;
    }
    .key-target:active, .key-target.active-key {
      background-color: rgba(255, 255, 255, 0.35);
      transform: scale(0.92);
    }
    
    /* Text layout on physical buttons */
    .key-target .num {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .key-target .sub {
      font-size: 9px;
      font-weight: 700;
      color: #4a5568;
      margin-top: 1px;
      letter-spacing: 0.2px;
    }
    
    .dir-highlight .num {
      color: #000000;
    }
  </style>
</head>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  const splashScreen = document.getElementById('splash-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const scoreLabel = document.getElementById('score-label');
  const speedLabel = document.getElementById('speed-label');
  const finalScore = document.getElementById('final-score');

  const gridSize = 4; 
  const cols = canvas.width / gridSize;  // 30
  const rows = canvas.height / gridSize; // 17
  
  let snake = [];
  let direction = { x: 1, y: 0 };
  let nextDirection = { x: 1, y: 0 };
  let food = { x: 0, y: 0 };
  let score = 0;
  let gameInterval = null;
  let isRunning = false;
  let currentSpeed = 100;

  function initGame() {
    snake = [
      { x: 8, y: 8, hasDot: false },
      { x: 7, y: 8, hasDot: false },
      { x: 6, y: 8, hasDot: false }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    currentSpeed = 100;
    updateHUD();
    spawnFood();
    
    splashScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, currentSpeed);
    isRunning = true;
  }

  function spawnFood() {
    let validPosition = false;
    while (!validPosition) {
      food.x = Math.floor(Math.random() * cols);
      food.y = Math.floor(Math.random() * rows);
      validPosition = !snake.some(cell => cell.x === food.x && cell.y === food.y);
    }
  }

  function gameLoop() {
    direction = nextDirection;
    
    let headX = snake[0].x + direction.x;
    let headY = snake[0].y + direction.y;

    if (headX < 0) headX = cols - 1;
    if (headX >= cols) headX = 0;
    if (headY < 0) headY = rows - 1;
    if (headY >= rows) headY = 0;

    if (snake.some(cell => cell.x === headX && cell.y === headY)) {
      endGame();
      return;
    }

    let ateFood = (headX === food.x && headY === food.y);

    for (let i = snake.length - 1; i > 0; i--) {
      snake[i].hasDot = snake[i - 1].hasDot;
    }

    snake.unshift({ x: headX, y: headY, hasDot: ateFood });

    if (ateFood) {
      score += 10;
      updateHUD();
      spawnFood();
      
      if (score % 50 === 0 && currentSpeed > 40) {
        currentSpeed -= 8;
        clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, currentSpeed);
      }
    } else {
      snake.pop();
    }

    render();
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0d2613';
    ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);

    let head = snake[0];
    let nextX = (head.x + direction.x + cols) % cols;
    let nextY = (head.y + direction.y + rows) % rows;
    let isNextToFood = (nextX === food.x && nextY === food.y);

    snake.forEach((cell, index) => {
      let px = cell.x * gridSize;
      let py = cell.y * gridSize;

      ctx.fillStyle = '#0d2613';

      if (index === 0) {
        if (isNextToFood) {
          ctx.fillRect(px, py, gridSize, gridSize);
          ctx.fillStyle = '#6abf81';
          if (direction.x === 1) ctx.fillRect(px + 2, py + 1, 2, 2);
          else if (direction.x === -1) ctx.fillRect(px, py + 1, 2, 2);
          else if (direction.y === 1) ctx.fillRect(px + 1, py + 2, 2, 2);
          else if (direction.y === -1) ctx.fillRect(px + 1, py, 2, 2);
        } else {
          ctx.fillRect(px, py, gridSize, gridSize);
        }
      } else {
        if (cell.hasDot) {
          ctx.fillRect(px, py, gridSize, gridSize);
          ctx.fillStyle = '#6abf81';
          ctx.fillRect(px + 1, py + 1, gridSize - 2, gridSize - 2);
          ctx.fillStyle = '#0d2613';
          ctx.fillRect(px + 1, py + 1, gridSize - 2, gridSize - 2);
        } else {
          ctx.fillRect(px + 0.5, py + 0.5, gridSize - 1, gridSize - 1);
        }
      }
    });
  }

  function updateHUD() {
    scoreLabel.innerText = `SCORE: ${String(score).padStart(4, '0')}`;
    const currentLevel = Math.min(9, Math.floor(score / 50) + 1);
    speedLabel.innerText = `Lv${currentLevel}`;
  }

  function endGame() {
    isRunning = false;
    clearInterval(gameInterval);
    finalScore.innerText = score;
    gameoverScreen.classList.remove('hidden');
  }

  function handleInput(cmd) {
    if (!isRunning) {
      if (cmd === 'ACTION' || cmd === 'START' || cmd === 'UP') {
        initGame();
      }
      return;
    }

    switch (cmd) {
      case 'UP':
        if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
        break;
      case 'DOWN':
        if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
        break;
      case 'LEFT':
        if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
        break;
      case 'RIGHT':
        if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
        break;
    }
  }

  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp':
      case '2':
        handleInput('UP'); triggerVisualFeedback('key-2'); break;
      case 'ArrowDown':
      case '8':
        handleInput('DOWN'); triggerVisualFeedback('key-8'); break;
      case 'ArrowLeft':
      case '4':
        handleInput('LEFT'); triggerVisualFeedback('key-4'); break;
      case 'ArrowRight':
      case '6':
        handleInput('RIGHT'); triggerVisualFeedback('key-6'); break;
      case ' ':
      case 'Enter':
      case '5':
        handleInput('ACTION'); triggerVisualFeedback('key-action'); break;
    }
  });

  const mobileKeyMap = {
    'key-2': 'UP',
    'key-8': 'DOWN',
    'key-4': 'LEFT',
    'key-6': 'RIGHT',
    'key-5': 'ACTION',
    'key-action': 'ACTION'
  };

  Object.keys(mobileKeyMap).forEach(id => {
    const btn = document.getElementById(id);
    if (!btn) return;
    const command = mobileKeyMap[id];
    
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleInput(command);
      btn.classList.add('active-key');
    });
    btn.addEventListener('touchend', () => {
      btn.classList.remove('active-key');
    });
    btn.addEventListener('mousedown', () => {
      handleInput(command);
    });
  });

  function triggerVisualFeedback(id) {
    const targetElement = document.getElementById(id);
    if (targetElement) {
      targetElement.classList.add('active-key');
      setTimeout(() => targetElement.classList.remove('active-key'), 100);
    }
  }

  render();
</script>

</body>
</html>
