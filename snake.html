<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nokia SVG - Fixed 3D Wireframe Snake II</title>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #121212;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    /* Cropped Zoom Container */
    .zoom-viewport {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 98vh;
      height: 98svh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Phone Shell Wrapper */
    .phone-wrapper {
      position: relative;
      width: 125%; 
      max-width: 430px;
      aspect-ratio: 128.4 / 300;
      transform: translateY(-17%);
      display: flex;
      justify-content: center;
      align-items: center;
      container-type: inline-size;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.6));
    }
    
    /* HTML Screen inside SVG ForeignObject */
    .lcd-display {
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      border: 1.5px solid #1a1a1a;
      font-family: monospace;
    }
    
    /* Scoreboard Header Bar */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a1a1a;
      padding: 2px 4px;
      font-size: 7px;
      font-weight: bold;
      color: #72db85;
      border-bottom: 1.5px solid #222222;
      height: 12px;
      box-sizing: border-box;
      flex-shrink: 0;
      z-index: 2;
    }

    /* Bonus Progress Timer Line */
    #bonus-timer-bar {
      position: absolute;
      top: 12px;
      left: 0;
      height: 2px;
      background-color: #ffd700;
      width: 0%;
      z-index: 3;
      transition: width 0.1s linear;
    }

    /* Dedicated 3D Canvas Host Container */
    #canvas-container {
      width: 100%;
      flex-grow: 1;
      background-color: #0a0a0a;
      display: block;
      position: relative;
    }

    #canvas-container canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .screen-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #72db85;
      text-align: center;
      z-index: 5;
    }
    .screen-overlay h2 {
      margin: 0 0 2px 0;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 0.5px;
    }
    .screen-overlay p {
      margin: 1px 0;
      font-size: 6px;
      font-weight: bold;
    }
    .hidden {
      display: none !important;
    }

    /* Keypad Visible Labels Overlay */
    .keypad-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .key-target {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #2c354d;
      font-weight: bold;
      line-height: 1;
      transition: transform 0.05s ease, background-color 0.1s ease;
      border-radius: 40%;
    }
    .key-target:active, .key-target.active-key {
      background-color: rgba(255, 255, 255, 0.35);
      transform: scale(0.92);
    }
    
    .key-target .num {
      font-size: clamp(10px, 4.2cqw, 15px);
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .key-target .sub {
      font-size: clamp(6px, 2.6cqw, 9px);
      font-weight: 700;
      color: #4a5568;
      margin-top: 1px;
      letter-spacing: 0.2px;
    }
    
    .dir-highlight .num {
      color: #000000;
    }
  </style>
</head>

<script>
  // --- RETRO SOUND SYNTHESIZER ---
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function playKeyClickSound() {
    initAudio();
    playTone(800, 'triangle', 0.03);
  }

  function playEatSound() {
    initAudio();
    playTone(600, 'square', 0.05);
    setTimeout(() => playTone(1200, 'square', 0.06), 50);
  }

  function playBonusEatSound() {
    initAudio();
    [523, 659, 783, 1046].forEach((f, i) => {
      setTimeout(() => playTone(f, 'square', 0.08), i * 45);
    });
  }

  function playLevelUpSound() {
    initAudio();
    [440, 554, 659, 880, 1108].forEach((f, i) => {
      setTimeout(() => playTone(f, 'triangle', 0.1), i * 60);
    });
  }

  function playGameOverSound() {
    initAudio();
    const notes = [400, 300, 200, 150];
    notes.forEach((freq, idx) => {
      setTimeout(() => playTone(freq, 'sawtooth', 0.12), idx * 120);
    });
  }

  // --- THREE.JS SCENE SETUP ---
  const container = document.getElementById('canvas-container');
  const cols = 22;
  const rows = 14;

  const scene = new THREE.Scene();
  // BLACK BACKGROUND SKY
  scene.background = new THREE.Color(0x0a0a0a);

  const aspect = 240 / 136;
  const camera = new THREE.PerspectiveCamera(40, aspect, .1, 1000); 
  camera.position.set(0, 18, 14); 
  camera.lookAt(0, -0.5, 0.6);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(240, 136);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0x666666, 0.95);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
  dirLight.position.set(8, 22, 10);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  scene.add(dirLight);

  // --- MOVING 3D CLOUDS (DARKER GREY FOR BLACK SKY) ---
  const cloudsGroup = new THREE.Group();
  const cloudMat = new THREE.MeshLambertMaterial({ color: 0x444444, transparent: true, opacity: 0.6 });

  function createCloud() {
    const cloud = new THREE.Group();
    const puffGeo = new THREE.DodecahedronGeometry(1, 0);
    
    for (let i = 0; i < 5; i++) {
      const puff = new THREE.Mesh(puffGeo, cloudMat);
      puff.position.set(
        (Math.random() - 0.5) * 2,
        (Math.random() - 0.5) * 0.5,
        (Math.random() - 0.5) * 1.5
      );
      const s = 0.8 + Math.random() * 0.8;
      puff.scale.set(s, s, s);
      cloud.add(puff);
    }
    return cloud;
  }

  const cloudsList = [];
  for (let i = 0; i < 6; i++) {
    const c = createCloud();
    c.position.set(
      (Math.random() - 0.5) * 40,
      8 + Math.random() * 4,
      -10 - Math.random() * 20
    );
    cloudsGroup.add(c);
    cloudsList.push(c);
  }
  scene.add(cloudsGroup);

  // --- GROUND & GRASSLAND ENVIRONMENT ---
  function createProceduralTerrainTexture() {
    const canvasTex = document.createElement('canvas');
    canvasTex.width = 256;
    canvasTex.height = 256;
    const c = canvasTex.getContext('2d');

    c.fillStyle = '#2b3d2b';
    c.fillRect(0, 0, 256, 256);

    c.fillStyle = '#223322';
    for (let x = 0; x < 256; x += 16) {
      for (let y = 0; y < 256; y += 16) {
        if ((x + y) % 32 === 0) c.fillRect(x, y, 16, 16);
      }
    }

    c.fillStyle = '#1c2b1c';
    for (let i = 0; i < 150; i++) {
      let px = Math.random() * 256;
      let py = Math.random() * 256;
      c.fillRect(px, py, 2, 2);
    }

    const texture = new THREE.CanvasTexture(canvasTex);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(1, 1);
    return texture;
  }

  const terrainTex = createProceduralTerrainTexture();
  const groundGeo = new THREE.BoxGeometry(cols + 2, 1.5, rows + 2);
  const groundMat = new THREE.MeshLambertMaterial({ map: terrainTex, color: 0xffffff });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.position.set(0, -0.75, 0);
  ground.receiveShadow = true;
  scene.add(ground);

  const cliffGeo = new THREE.BoxGeometry(cols + 2.2, 3, rows + 2.2);
  const cliffMat = new THREE.MeshLambertMaterial({ color: 0x182618 });
  const cliff = new THREE.Mesh(cliffGeo, cliffMat);
  cliff.position.set(0, -2.25, 0);
  scene.add(cliff);

  // Surround Grassland Plane (Behind the main board)
  const outerGrassGeo = new THREE.PlaneGeometry(80, 80);
  const outerGrassMat = new THREE.MeshLambertMaterial({ color: 0x1c2b1c });
  const outerGrass = new THREE.Mesh(outerGrassGeo, outerGrassMat);
  outerGrass.rotation.x = -Math.PI / 2;
  outerGrass.position.set(0, -1.5, 0);
  outerGrass.receiveShadow = true;
  scene.add(outerGrass);

  // SWAYING GRASS TUFTS
  const grassGroup = new THREE.Group();
  const grassBlades = [];
  const grassGeo = new THREE.ConeGeometry(0.12, 0.45, 3);
  const grassMat = new THREE.MeshLambertMaterial({ color: 0x223322 });

  for (let i = 0; i < 1000; i++) {
    const blade = new THREE.Mesh(grassGeo, grassMat);
    let rx = (Math.random() - 0.5) * (cols + 20);
    let rz = (Math.random() - 0.5) * (rows + 20);
    
    if (Math.abs(rx) < cols / 2 && Math.abs(rz) < rows / 2) {
      rx += (rx > 0 ? 3 : -3);
    }
    
    blade.position.set(rx, -1.25, rz);
    blade.rotation.x = (Math.random() - 0.5) * 0.2;
    blade.rotation.z = (Math.random() - 0.5) * 0.2;
    grassGroup.add(blade);
    grassBlades.push(blade);
  }
  scene.add(grassGroup);

  // Environment Border Trees
  const envGroup = new THREE.Group();
  function createLowPolyTree(x, z) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.2, 1.2, 5),
      new THREE.MeshLambertMaterial({ color: 0x0f1a0f })
    );
    trunk.position.y = 0.6;
    trunk.castShadow = true;
    tree.add(trunk);

    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(0.75, 1.8, 5),
      new THREE.MeshLambertMaterial({ color: 0x182618 })
    );
    leaves.position.y = 1.8;
    leaves.castShadow = true;
    tree.add(leaves);

    tree.position.set(x, 0, z);
    return tree;
  }

  const marginX = cols / 2 + 0.8;
  const marginZ = rows / 2 + 0.8;

  [-marginX, marginX].forEach(x => {
    for (let z = -marginZ; z <= marginZ; z += 3.5) {
      envGroup.add(createLowPolyTree(x, z + (Math.random() - 0.5)));
    }
  });
  [-marginZ, marginZ].forEach(z => {
    for (let x = -marginX + 2; x <= marginX - 2; x += 3.5) {
      envGroup.add(createLowPolyTree(x + (Math.random() - 0.5), z));
    }
  });
  scene.add(envGroup);

  // --- MATERIALS ---
  const snakeFillMat = new THREE.MeshLambertMaterial({ color: 0x053a18, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const snakeWireLineMat = new THREE.LineBasicMaterial({ color: 0x20ff55, linewidth: 1 });

  const foodFillMat = new THREE.MeshLambertMaterial({ color: 0x661100, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const foodWireLineMat = new THREE.LineBasicMaterial({ color: 0xff8800, linewidth: 1 });

  const bonusFillMat = new THREE.MeshLambertMaterial({ color: 0x553300, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const bonusWireLineMat = new THREE.LineBasicMaterial({ color: 0xffd700, linewidth: 1 });

  const eyeVisorMat = new THREE.MeshBasicMaterial({ color: 0x20ff55 });

  // 3D Wireframe Orange Food Cube
  const foodGroup = new THREE.Group();
  const foodGeo = new THREE.BoxGeometry(0.85, 0.85, 0.85);
  const foodMeshInner = new THREE.Mesh(foodGeo, foodFillMat);
  const foodMeshWire = new THREE.LineSegments(new THREE.EdgesGeometry(foodGeo), foodWireLineMat);
  foodGroup.add(foodMeshInner);
  foodGroup.add(foodMeshWire);
  scene.add(foodGroup);

  // 3D Bonus Item (Gold Diamond)
  const bonusGroup = new THREE.Group();
  const bonusGeo = new THREE.OctahedronGeometry(0.6, 0);
  const bonusInner = new THREE.Mesh(bonusGeo, bonusFillMat);
  const bonusWire = new THREE.LineSegments(new THREE.EdgesGeometry(bonusGeo), bonusWireLineMat);
  bonusGroup.add(bonusInner);
  bonusGroup.add(bonusWire);
  bonusGroup.visible = false;
  scene.add(bonusGroup);

  // 3D Snake Group
  const snakeGroup = new THREE.Group();
  scene.add(snakeGroup);

  // GAME ENGINE STATE
  let snake = [];
  let direction = { x: 1, y: 0 };
  let nextDirection = { x: 1, y: 0 };
  let food = { x: 0, y: 0 };
  
  let bonusActive = false;
  let bonusPos = { x: -1, y: -1 };
  let bonusTimer = 0;
  let bonusMaxTime = 30; 
  let foodsEatenCount = 0;

  let score = 0;
  let gameInterval = null;
  let isRunning = false;
  let currentSpeed = 100;

  // Rainbow Glow Effect State on Level Up
  let rainbowEffectTimer = 0;
  let rainbowMaxDuration = 40;

  const splashScreen = document.getElementById('splash-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const scoreLabel = document.getElementById('score-label');
  const speedLabel = document.getElementById('speed-label');
  const finalScore = document.getElementById('final-score');
  const bonusTimerBar = document.getElementById('bonus-timer-bar');

  function gridToWorld(x, y) {
    return {
      x: x - cols / 2 + 0.5,
      z: y - rows / 2 + 0.5
    };
  }

  function initGame() {
    initAudio();
    snake = [
      { x: 6, y: 7, hasDot: false },
      { x: 5, y: 7, hasDot: false },
      { x: 4, y: 7, hasDot: false }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    currentSpeed = 100;
    foodsEatenCount = 0;
    rainbowEffectTimer = 0;
    bonusActive = false;
    bonusGroup.visible = false;
    bonusTimerBar.style.width = '0%';
    
    updateHUD();
    spawnFood();
    
    splashScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, currentSpeed);
    isRunning = true;
  }

  function spawnFood() {
    let validPosition = false;
    while (!validPosition) {
      food.x = Math.floor(Math.random() * cols);
      food.y = Math.floor(Math.random() * rows);
      validPosition = !snake.some(cell => cell.x === food.x && cell.y === food.y) &&
                      !(bonusActive && bonusPos.x === food.x && bonusPos.y === food.y);
    }
    const pos = gridToWorld(food.x, food.y);
    foodGroup.position.set(pos.x, 0.45, pos.z);
  }

  function spawnBonus() {
    let validPosition = false;
    while (!validPosition) {
      bonusPos.x = Math.floor(Math.random() * cols);
      bonusPos.y = Math.floor(Math.random() * rows);
      validPosition = !snake.some(cell => cell.x === bonusPos.x && cell.y === bonusPos.y) &&
                      !(food.x === bonusPos.x && food.y === bonusPos.y);
    }
    const pos = gridToWorld(bonusPos.x, bonusPos.y);
    bonusGroup.position.set(pos.x, 0.6, pos.z);
    bonusActive = true;
    bonusGroup.visible = true;
    bonusTimer = bonusMaxTime;
  }

  function gameLoop() {
    direction = nextDirection;
    
    let headX = snake[0].x + direction.x;
    let headY = snake[0].y + direction.y;

    if (headX < 0) headX = cols - 1;
    if (headX >= cols) headX = 0;
    if (headY < 0) headY = rows - 1;
    if (headY >= rows) headY = 0;

    if (snake.some(cell => cell.x === headX && cell.y === headY)) {
      endGame();
      return;
    }

    let ateFood = (headX === food.x && headY === food.y);
    let ateBonus = (bonusActive && headX === bonusPos.x && headY === bonusPos.y);

    if (bonusActive) {
      bonusTimer--;
      let pct = (bonusTimer / bonusMaxTime) * 100;
      bonusTimerBar.style.width = `${Math.max(0, pct)}%`;
      if (bonusTimer <= 0) {
        bonusActive = false;
        bonusGroup.visible = false;
        bonusTimerBar.style.width = '0%';
      }
    }

    for (let i = snake.length - 1; i > 0; i--) {
      snake[i].hasDot = snake[i - 1].hasDot;
    }

    snake.unshift({ x: headX, y: headY, hasDot: ateFood || ateBonus });

    if (ateFood) {
      playEatSound();
      score += 10;
      foodsEatenCount++;
      
      // TRIGGER RAINBOW GLOW EFFECT ON LEVEL UP (Every 50 points)
      if (score % 50 === 0) {
        rainbowEffectTimer = rainbowMaxDuration;
        playLevelUpSound();
        if (currentSpeed > 40) {
          currentSpeed -= 8;
          clearInterval(gameInterval);
          gameInterval = setInterval(gameLoop, currentSpeed);
        }
      }

      updateHUD();
      spawnFood();

      if (foodsEatenCount % 5 === 0 && !bonusActive) {
        spawnBonus();
      }
    } else if (ateBonus) {
      playBonusEatSound();
      score += 30;
      
      if (score % 50 === 0) {
        rainbowEffectTimer = rainbowMaxDuration;
        playLevelUpSound();
      }

      bonusActive = false;
      bonusGroup.visible = false;
      bonusTimerBar.style.width = '0%';
      updateHUD();
    } else {
      snake.pop();
    }

    render3DSnake();
  }

  // --- RENDER DYNAMIC 3D SNAKE WITH RAINBOW GLOW ---
  function render3DSnake() {
    while (snakeGroup.children.length > 0) {
      snakeGroup.remove(snakeGroup.children[0]);
    }

    let head = snake[0];
    let nextX = (head.x + direction.x + cols) % cols;
    let nextY = (head.y + direction.y + rows) % rows;
    
    let isNextToTarget = (nextX === food.x && nextY === food.y) || 
                         (bonusActive && nextX === bonusPos.x && nextY === bonusPos.y);

    snake.forEach((cell, index) => {
      const pos = gridToWorld(cell.x, cell.y);
      const segmentGroup = new THREE.Group();

      let currentFillMat = snakeFillMat;
      let currentWireMat = snakeWireLineMat;

      // Rainbow Glow color calculation
      if (rainbowEffectTimer > 0) {
        let hue = ((Date.now() * 0.005) - (index / snake.length) * 0.8) % 1.0;
        if (hue < 0) hue += 1.0;

        currentFillMat = new THREE.MeshLambertMaterial({ 
          color: new THREE.Color().setHSL(hue, 0.9, 0.4),
          polygonOffset: true,
          polygonOffsetFactor: 1,
          polygonOffsetUnits: 1
        });

        currentWireMat = new THREE.LineBasicMaterial({ 
          color: new THREE.Color().setHSL(hue, 1.0, 0.75), 
          linewidth: 1.5 
        });
      }

      if (index === 0) {
        // --- 3D SNAKE HEAD ---
        const headPivot = new THREE.Group();

        const upperJawGeo = new THREE.BoxGeometry(0.85, 0.4, 0.85);
        const upperInner = new THREE.Mesh(upperJawGeo, currentFillMat);
        const upperWire = new THREE.LineSegments(new THREE.EdgesGeometry(upperJawGeo), currentWireMat);
        const upperJaw = new THREE.Group();
        upperJaw.add(upperInner); upperJaw.add(upperWire);

        const lowerJawGeo = new THREE.BoxGeometry(0.85, 0.35, 0.85);
        const lowerInner = new THREE.Mesh(lowerJawGeo, currentFillMat);
        const lowerWire = new THREE.LineSegments(new THREE.EdgesGeometry(lowerJawGeo), currentWireMat);
        const lowerJaw = new THREE.Group();
        lowerJaw.add(lowerInner); lowerJaw.add(lowerWire);

        const eyeGeo = new THREE.BoxGeometry(0.88, 0.1, 0.2);
        const eyes = new THREE.Mesh(eyeGeo, eyeVisorMat);
        eyes.position.set(0, 0.1, -0.2);
        upperJaw.add(eyes);

        if (isNextToTarget) {
          upperJaw.position.set(0, 0.3, 0);
          lowerJaw.position.set(0, -0.2, 0);
        } else {
          upperJaw.position.set(0, 0.2, 0);
          lowerJaw.position.set(0, -0.15, 0);
        }

        headPivot.add(upperJaw);
        headPivot.add(lowerJaw);

        let rotY = 0;
        if (direction.x === 1) rotY = Math.PI / 2;
        else if (direction.x === -1) rotY = -Math.PI / 2;
        else if (direction.y === 1) rotY = Math.PI;
        else if (direction.y === -1) rotY = 0;
        
        headPivot.rotation.y = rotY;

        segmentGroup.add(headPivot);
        segmentGroup.position.set(pos.x, 0.45, pos.z);
      } else {
        let boxGeo;
        if (cell.hasDot) {
          boxGeo = new THREE.BoxGeometry(1.05, 1.25, 1.05);
          segmentGroup.position.set(pos.x, 0.55, pos.z);
        } else {
          boxGeo = new THREE.BoxGeometry(0.85, 0.75, 0.85);
          segmentGroup.position.set(pos.x, 0.38, pos.z);
        }

        const innerFill = new THREE.Mesh(boxGeo, currentFillMat);
        const thinWire = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), currentWireMat);
        segmentGroup.add(innerFill);
        segmentGroup.add(thinWire);
      }

      snakeGroup.add(segmentGroup);
    });
  }

  function animate() {
    requestAnimationFrame(animate);

    // Drifting Clouds
    cloudsList.forEach(c => {
      c.position.x += 0.02;
      if (c.position.x > 25) c.position.x = -25;
    });

    // Swaying Grass Tufts Animation
    const t = Date.now() * 0.003;
    grassBlades.forEach((b, i) => {
      b.rotation.z = Math.sin(t + i) * 0.12;
    });

    // Rainbow Effect Timer Countdown
    if (rainbowEffectTimer > 0) {
      rainbowEffectTimer--;
      render3DSnake();
    }

    if (foodGroup) {
      foodGroup.rotation.y += 0.05;
      foodGroup.rotation.x += 0.02;
      foodGroup.position.y = 0.5 + Math.sin(Date.now() * 0.006) * 0.12;
    }
    if (bonusActive && bonusGroup) {
      bonusGroup.rotation.y += 0.08;
      bonusGroup.position.y = 0.6 + Math.sin(Date.now() * 0.01) * 0.18;
    }
    renderer.render(scene, camera);
  }
  animate();

  function updateHUD() {
    scoreLabel.innerText = `SCORE: ${String(score).padStart(4, '0')}`;
    const currentLevel = Math.min(9, Math.floor(score / 50) + 1);
    speedLabel.innerText = `Lv${currentLevel}`;
  }

  function endGame() {
    isRunning = false;
    clearInterval(gameInterval);
    playGameOverSound();
    finalScore.innerText = score;
    bonusTimerBar.style.width = '0%';
    gameoverScreen.classList.remove('hidden');
  }

  function handleInput(cmd) {
    playKeyClickSound();
    if (!isRunning) {
      if (cmd === 'ACTION' || cmd === 'START' || cmd === 'UP') {
        initGame();
      }
      return;
    }

    switch (cmd) {
      case 'UP':
        if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
        break;
      case 'DOWN':
        if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
        break;
      case 'LEFT':
        if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
        break;
      case 'RIGHT':
        if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
        break;
    }
  }

  // Keyboard Event Handlers
  window.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp':
      case '2':
        handleInput('UP'); triggerVisualFeedback('key-2'); break;
      case 'ArrowDown':
      case '5':
        handleInput('DOWN'); triggerVisualFeedback('key-5'); break;
      case 'ArrowLeft':
      case '4':
        handleInput('LEFT'); triggerVisualFeedback('key-4'); break;
      case 'ArrowRight':
      case '6':
        handleInput('RIGHT'); triggerVisualFeedback('key-6'); break;
      case ' ':
      case 'Enter':
      case '8':
        handleInput('ACTION'); triggerVisualFeedback('key-action'); break;
    }
  });

  // Mobile Touch Controls
  const mobileKeyMap = {
    'key-2': 'UP',
    'key-8': 'ACTION',
    'key-4': 'LEFT',
    'key-6': 'RIGHT',
    'key-5': 'DOWN',
    'key-action': 'ACTION'
  };

  Object.keys(mobileKeyMap).forEach(id => {
    const btn = document.getElementById(id);
    if (!btn) return;
    const command = mobileKeyMap[id];
    
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleInput(command);
      btn.classList.add('active-key');
    });
    btn.addEventListener('touchend', () => {
      btn.classList.remove('active-key');
    });
    btn.addEventListener('mousedown', () => {
      handleInput(command);
    });
  });

  function triggerVisualFeedback(id) {
    const targetElement = document.getElementById(id);
    if (targetElement) {
      targetElement.classList.add('active-key');
      setTimeout(() => targetElement.classList.remove('active-key'), 100);
    }
  }

  render3DSnake();
</script>

</body>
</html>
